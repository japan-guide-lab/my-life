<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MY LIFE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <header>
        <h1>MY LIFE</h1>
        <p id="today"></p>
    </header>

    <main>

        <section class="card">
            <h2>今日の状態</h2>

            <label>
                睡眠時間
                <input type="number" id="sleep" min="0" max="24" step="0.5" placeholder="例：7">
            </label>

            <label>
                体調
                <input type="number" id="health" min="1" max="10" placeholder="1〜10">
            </label>

            <label>
                気分
                <input type="number" id="mood" min="1" max="10" placeholder="1〜10">
            </label>
        </section>


        <section class="card">
            <h2>今日やったこと</h2>

            <textarea
                id="done"
                placeholder="今日やったことを書いてください">
            </textarea>
        </section>


        <section class="card">
            <h2>お金</h2>

            <label>
                今日使った金額
                <input type="number" id="money" min="0" placeholder="円">
            </label>

            <label>
                大きな支出
                <input type="text" id="bigExpense" placeholder="あれば入力">
            </label>
        </section>


        <section class="card">
            <h2>今日よかったこと</h2>

            <textarea
                id="good"
                placeholder="今日よかったこと">
            </textarea>
        </section>


        <section class="card">
            <h2>今日の反省</h2>

            <textarea
                id="reflection"
                placeholder="今日の反省">
            </textarea>
        </section>


        <section class="card">
            <h2>明日やること</h2>

            <textarea
                id="tomorrow"
                placeholder="明日やること">
            </textarea>
        </section>


        <section class="card">
            <h2>AIに相談したいこと</h2>

            <textarea
                id="aiQuestion"
                placeholder="AIに相談したいこと">
            </textarea>
        </section>


        <button id="saveButton">
            保存する
        </button>

        <p id="status"></p>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
