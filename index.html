<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MY LIFE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- ==================== -->
    <!-- HEADER -->
    <!-- ==================== -->

    <header class="app-header">

        <div>
            <p class="eyebrow">MY LIFE</p>
            <h1>今日の記録</h1>
        </div>

        <div class="today">
            <span id="today"></span>
        </div>

    </header>


    <!-- ==================== -->
    <!-- MAIN -->
    <!-- ==================== -->

    <main class="main-content">


        <!-- 今日の状態 -->

        <section class="card">

            <div class="section-header">

                <div>
                    <p class="section-label">TODAY</p>
                    <h2>今日の状態</h2>
                </div>

            </div>


            <div class="metrics">

                <div class="metric">

                    <label for="sleep">
                        睡眠時間
                    </label>

                    <div class="input-with-unit">

                        <input
                            type="number"
                            id="sleep"
                            min="0"
                            max="24"
                            step="0.5"
                            placeholder="7"
                        >

                        <span>時間</span>

                    </div>

                </div>


                <div class="metric">

                    <label for="health">
                        体調
                    </label>

                    <div class="input-with-unit">

                        <input
                            type="number"
                            id="health"
                            min="1"
                            max="10"
                            placeholder="8"
                        >

                        <span>/10</span>

                    </div>

                </div>


                <div class="metric">

                    <label for="mood">
                        気分
                    </label>

                    <div class="input-with-unit">

                        <input
                            type="number"
                            id="mood"
                            min="1"
                            max="10"
                            placeholder="7"
                        >

                        <span>/10</span>

                    </div>

                </div>

            </div>

        </section>


        <!-- 今日やったこと -->

        <section class="card">

            <div class="section-header">

                <div>

                    <p class="section-label">
                        ACTION
                    </p>

                    <h2>今日やったこと</h2>

                </div>

            </div>


            <p class="description">
                今日取り組んだこと、できたことを書きます。
            </p>


            <textarea
                id="done"
                placeholder="例：
・仕事をした
・ジムに行った
・人生について考えた"
            ></textarea>

        </section>


        <!-- お金 -->

        <section class="card">

            <div class="section-header">

                <div>

                    <p class="section-label">
                        MONEY
                    </p>

                    <h2>お金</h2>

                </div>

            </div>


            <div class="form-group">

                <label for="money">
                    今日使った金額
                </label>

                <div class="input-with-unit">

                    <input
                        type="number"
                        id="money"
                        min="0"
                        placeholder="0"
                    >

                    <span>円</span>

                </div>

            </div>


            <div class="form-group">

                <label for="bigExpense">
                    大きな支出
                </label>

                <input
                    type="text"
                    id="bigExpense"
                    placeholder="なければ空欄でOK"
                >

            </div>

        </section>


        <!-- よかったこと -->

        <section class="card">

            <div class="section-header">

                <div>

                    <p class="section-label">
                        GOOD
                    </p>

                    <h2>今日よかったこと</h2>

                </div>

            </div>


            <p class="description">
                小さなことでもOKです。
            </p>


            <textarea
                id="good"
                placeholder="例：
ちゃんと人生について考えられた"
            ></textarea>

        </section>


        <!-- 反省 -->

        <section class="card">

            <div class="section-header">

                <div>

                    <p class="section-label">
                        REFLECTION
                    </p>

                    <h2>今日の反省</h2>

                </div>

            </div>


            <p class="description">
                明日以降に改善したいことを書きます。
            </p>


            <textarea
                id="reflection"
                placeholder="例：
午後3時に起きてしまった"
            ></textarea>

        </section>


        <!-- 明日 -->

        <section class="card">

            <div class="section-header">

                <div>

                    <p class="section-label">
                        TOMORROW
                    </p>

                    <h2>明日やること</h2>

                </div>

            </div>


            <p class="description">
                明日やることを優先順位順に書きます。
            </p>


            <textarea
                id="tomorrow"
                placeholder="例：
1. 掃除
2. ジム
3. 仕事"
            ></textarea>

        </section>


        <!-- AI -->

        <section class="card ai-card">

            <div class="section-header">

                <div>

                    <p class="section-label">
                        AI
                    </p>

                    <h2>AIに相談したいこと</h2>

                </div>

            </div>


            <p class="description">
                今日感じたことや、考えたいことを自由に書いてください。
            </p>


            <textarea
                id="aiQuestion"
                placeholder="例：
最近、人生の方向性について迷っている。"
            ></textarea>

        </section>


        <!-- 保存 -->

        <section class="save-section">

            <button
                id="saveButton"
                class="save-button"
            >
                今日の記録を保存
            </button>

            <p
                id="status"
                class="status"
            ></p>

        </section>


    </main>


    <!-- ==================== -->
    <!-- BOTTOM NAV -->
    <!-- ==================== -->

    <nav class="bottom-nav">

        <a
            href="index.html"
            class="nav-item active"
        >

            <span class="nav-icon">＋</span>
            <span>今日</span>

        </a>


        <a
            href="analysis.html"
            class="nav-item"
        >

            <span class="nav-icon">◌</span>
            <span>分析</span>

        </a>


        <a
            href="ai.html"
            class="nav-item"
        >

            <span class="nav-icon">✦</span>
            <span>AI</span>

        </a>

    </nav>

</div>


<script src="script.js"></script>

</body>

</html>
