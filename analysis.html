<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MY LIFE - 分析</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div class="app">


    <!-- HEADER -->

    <header class="app-header">

        <div>

            <p class="eyebrow">
                MY LIFE
            </p>

            <h1>
                7日間の分析
            </h1>

        </div>


        <div class="today">

            <span id="today"></span>

        </div>

    </header>



    <main class="main-content">


        <!-- 期間 -->

        <section class="card period-card">

            <p class="section-label">
                PERIOD
            </p>

            <h2 id="period">
                読み込み中...
            </h2>

            <p
                id="recordSummary"
                class="description"
            ></p>

        </section>



        <!-- サマリー -->

        <section class="card">

            <div class="section-header">

                <div>

                    <p class="section-label">
                        SUMMARY
                    </p>

                    <h2>
                        7日間のサマリー
                    </h2>

                </div>

            </div>


            <div class="summary-grid">


                <div class="summary-item">

                    <span class="summary-label">
                        記録日数
                    </span>

                    <strong id="recordCount">
                        -
                    </strong>

                    <span>
                        / 7日
                    </span>

                </div>


                <div class="summary-item">

                    <span class="summary-label">
                        平均睡眠
                    </span>

                    <strong id="averageSleep">
                        -
                    </strong>

                    <span>
                        時間
                    </span>

                </div>


                <div class="summary-item">

                    <span class="summary-label">
                        平均体調
                    </span>

                    <strong id="averageHealth">
                        -
                    </strong>

                    <span>
                        /10
                    </span>

                </div>


                <div class="summary-item">

                    <span class="summary-label">
                        平均気分
                    </span>

                    <strong id="averageMood">
                        -
                    </strong>

                    <span>
                        /10
                    </span>

                </div>


            </div>

        </section>



        <!-- 気分 -->

        <section class="card">

            <div class="section-header">

                <div>

                    <p class="section-label">
                        MOOD
                    </p>

                    <h2>
                        気分の推移
                    </h2>

                </div>

            </div>


            <div
                id="moodChart"
                class="chart"
            ></div>

        </section>



        <!-- 睡眠 -->

        <section class="card">

            <div class="section-header">

                <div>

                    <p class="section-label">
                        SLEEP
                    </p>

                    <h2>
                        睡眠時間の推移
                    </h2>

                </div>

            </div>


            <div
                id="sleepChart"
                class="chart"
            ></div>

        </section>



        <!-- 傾向 -->

        <section class="card">

            <div class="section-header">

                <div>

                    <p class="section-label">
                        TRENDS
                    </p>

                    <h2>
                        最近の傾向
                    </h2>

                </div>

            </div>


            <div
                id="trendList"
                class="trend-list"
            ></div>

        </section>



        <!-- 良かったこと -->

        <section class="card">

            <div class="section-header">

                <div>

                    <p class="section-label">
                        GOOD
                    </p>

                    <h2>
                        最近よかったこと
                    </h2>

                </div>

            </div>


            <div
                id="goodList"
                class="text-list"
            ></div>

        </section>



        <!-- 反省 -->

        <section class="card">

            <div class="section-header">

                <div>

                    <p class="section-label">
                        REFLECTION
                    </p>

                    <h2>
                        最近の反省・気になること
                    </h2>

                </div>

            </div>


            <div
                id="reflectionList"
                class="text-list"
            ></div>

        </section>



        <!-- 記録一覧 -->

        <section class="card">

            <div class="section-header">

                <div>

                    <p class="section-label">
                        RECORDS
                    </p>

                    <h2>
                        7日間の記録
                    </h2>

                </div>

            </div>


            <div
                id="recordList"
                class="record-list"
            ></div>

        </section>



        <!-- STATUS -->

        <p
            id="status"
            class="status"
        >
            読み込み中...
        </p>


    </main>



    <!-- BOTTOM NAV -->

    <nav class="bottom-nav">


        <a
            href="index.html"
            class="nav-item"
        >

            <span class="nav-icon">
                ＋
            </span>

            <span>
                今日
            </span>

        </a>


        <a
            href="analysis.html"
            class="nav-item active"
        >

            <span class="nav-icon">
                ◌
            </span>

            <span>
                分析
            </span>

        </a>


        <a
            href="ai.html"
            class="nav-item"
        >

            <span class="nav-icon">
                ✦
            </span>

            <span>
                AI
            </span>

        </a>


    </nav>


</div>


<script
    src="https://cdn.plot.ly/plotly-3.7.0.min.js"
    charset="utf-8"
></script>

<script src="analysis.js"></script>

</body>

</html>
